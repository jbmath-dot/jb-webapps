<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173d33" />
  <meta name="description" content="가족 식단 A·B·C, 요일별 레시피와 마켓컬리 장보기, 어린이집 방학·휴원일 관리" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="우리집 식단" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  
  <title>우리집 식단 & 장보기</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🍚</span><div><p class="eyebrow">OUR FAMILY TABLE</p><h1>우리집 식단<span class="brand-amp"> & 장보기</span></h1></div></div>
      <button id="installBtn" class="install" hidden aria-label="휴대폰에 앱 설치하기">＋ 홈 화면</button>
    </header>
    <section class="headline" aria-label="주간 식단 설정">
      <div class="headline-row"><div><p class="eyebrow light">우리 가족의 일주일</p><h2 id="weekHeading">10.31 — 11.06</h2><p id="deliveryText">금요일 장보기 · 토요일 오전 수령</p></div><div class="week-nav"><button id="prevWeek" title="이전 주" aria-label="이전 주">‹</button><button id="nextWeek" title="다음 주" aria-label="다음 주">›</button></div></div>
      <div class="people-line"><span>성인 2명</span><span>첫째 27개월</span><span>둘째 이유식 별도</span></div>
    </section>
    <section class="plan-selector" aria-label="장보기 플랜 선택"><div class="section-head"><h3>이번 주 어떤 방식으로 준비할까요?</h3><span class="tiny-muted">3가지 독립 식단</span></div><div class="plans" id="plans"></div></section>
    <div class="notice-row" id="noticeRow" role="status"></div>
    <main id="mainContent" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="메인 메뉴">
      <button class="navitem selected" data-view="today"><span class="navicon">◉</span><span>오늘</span></button>
      <button class="navitem" data-view="week"><span class="navicon">▦</span><span>주간</span></button>
      <button class="navitem" data-view="shop"><span class="navicon">▤</span><span>장보기</span></button>
      <button class="navitem" data-view="settings"><span class="navicon">⚙</span><span>설정</span></button>
    </nav>
  </div>
  <dialog id="recipeDialog" class="recipe-dialog"><div id="dialogContent"></div><button class="close-dialog" id="closeDialog" aria-label="레시피 닫기">×</button></dialog>
  <script src="kurly-members.js"></script>
  <script src="bundle-loader.js"></script>
</body>
</html>
